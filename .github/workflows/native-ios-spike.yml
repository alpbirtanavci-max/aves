name: Native iOS fizibilite denemesi

# Aynı native/ Capacitor projesinin iOS platformunu, imzalama/Apple Developer
# hesabı OLMADAN, yalnız simülatör hedefi için derler (simulator build kod
# imzası istemez). Amaç: iOS tarafının da teknik olarak mümkün olduğunu
# gerçek bir macOS + Xcode ortamında kanıtlamak. Yalnız
# claude/native-feasibility-spike dalında ve elle tetiklemede çalışır.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/native-feasibility-spike

jobs:
  ios-simulator-build:
    name: iOS simülatör derlemesi
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bağımlılıkları kur
        working-directory: native
        run: npm install
      - name: Web kaynağının production ile eş olduğunu doğrula
        # Codex incelemesi (PR #27): native/ webDir'i doğrudan
        # work/r15d-rc1-unified/app'i gösterir ama bu dal production'dan
        # geride kalırsa paketlenen kabuk sessizce eskir. Bu adım, o dalın
        # o an production'daki (claude/aves-saha-denetim-brief-4x9wxx)
        # app/ klasörüyle BİREBİR aynı olmasını zorunlu kılar.
        run: |
          git fetch origin claude/aves-saha-denetim-brief-4x9wxx
          if ! git diff --quiet origin/claude/aves-saha-denetim-brief-4x9wxx -- work/r15d-rc1-unified/app; then
            echo "::error::native/ dalındaki work/r15d-rc1-unified/app, production (claude/aves-saha-denetim-brief-4x9wxx) ile birebir eşleşmiyor. Önce bu dalı production'a senkronlayın (merge/rebase), sonra tekrar derleyin."
            git diff --stat origin/claude/aves-saha-denetim-brief-4x9wxx -- work/r15d-rc1-unified/app
            exit 1
          fi
          echo "Web kaynağı production ile birebir eşleşiyor."
      - name: iOS platformunu ekle
        working-directory: native
        run: npx cap add ios
      - name: Kamera izin metnini Info.plist'e ekle
        # Uygulama içi kamera (getUserMedia, rc3.9.60) WKWebView'da
        # NSCameraUsageDescription olmadan çalışmaz — cap add ios her
        # çalışmada projeyi tazeden ürettiği için bu adım her seferinde
        # gerekli. Mikrofon istenmiyor (audio:false) ama bazı WebKit
        # sürümleri izin isteğini birlikte değerlendirdiğinden savunma
        # amaçlı eklendi.
        working-directory: native/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'AVES, uygunsuzluk fotoğrafı çekmek için kameraya erişir.'" Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'AVES mikrofon kullanmaz; bu izin bazı tarayıcı sürümlerinin kamera isteğiyle birlikte sorması nedeniyle tanımlıdır.'" Info.plist
      - name: AVES ikon + açılış ekranını üret
        working-directory: native
        run: npx capacitor-assets generate --ios
      - name: CocoaPods bağımlılıklarını kur
        working-directory: native/ios/App
        run: pod install
      - name: Web varlıklarını native projeye senkronla
        working-directory: native
        run: npx cap sync ios
      - name: Paketlenen app.js'in sürümünü ve hash'ini yazdır (denetim izi)
        run: |
          echo "APP_VERSION: $(grep -o "const APP_VERSION = '[^']*'" native/ios/App/App/public/app.js)"
          echo "SHA-256: $(shasum -a 256 native/ios/App/App/public/app.js | cut -d' ' -f1)"
      - name: Simülatör için derle (imzasız)
        working-directory: native/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
