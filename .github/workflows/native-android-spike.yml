name: Native Android fizibilite denemesi

# AVES Saha Denetim'in mevcut work/r15d-rc1-unified/app kabuğunu (dokunulmadan)
# Capacitor ile sarmalayan native/ dizinini derler. Yerel Android SDK
# gerektirmeden bulutta gerçek bir debug APK üretip fizibiliteyi kanıtlar.
# Yalnız claude/native-feasibility-spike dalında ve elle tetiklemede çalışır —
# production CI zincirini etkilemez.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/native-feasibility-spike

jobs:
  android-debug-build:
    name: Android debug APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # ubuntu-latest runner'ı Android SDK ile önceden gelir (ANDROID_HOME
      # zaten ayarlı); android-actions/setup-android@v3 artık var olmayan
      # eski "tools" paketini aramaya çalışıp hata veriyordu — gereksizdi.
      - name: Bağımlılıkları kur
        working-directory: native
        run: npm install
      - name: Web kaynağının production ile eş olduğunu doğrula
        # Codex incelemesi (PR #27): native/ webDir'i doğrudan
        # work/r15d-rc1-unified/app'i gösterir ama bu dal production'dan
        # geride kalırsa (rebase/merge unutulursa) paketlenen kabuk sessizce
        # eskir. Bu adım, o dalın o an production'daki (claude/aves-saha-
        # denetim-brief-4x9wxx) app/ klasörüyle BİREBİR aynı olmasını
        # zorunlu kılar; farklıysa derleme kırmızı olur.
        run: |
          git fetch origin claude/aves-saha-denetim-brief-4x9wxx
          if ! git diff --quiet origin/claude/aves-saha-denetim-brief-4x9wxx -- work/r15d-rc1-unified/app; then
            echo "::error::native/ dalındaki work/r15d-rc1-unified/app, production (claude/aves-saha-denetim-brief-4x9wxx) ile birebir eşleşmiyor. Önce bu dalı production'a senkronlayın (merge/rebase), sonra tekrar derleyin."
            git diff --stat origin/claude/aves-saha-denetim-brief-4x9wxx -- work/r15d-rc1-unified/app
            exit 1
          fi
          echo "Web kaynağı production ile birebir eşleşiyor."
      - name: Web varlıklarını native projeye senkronla
        working-directory: native
        run: npx cap sync android
      - name: Debug APK derle
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Paketlenen app.js'in sürümünü ve hash'ini yazdır (denetim izi)
        run: |
          echo "APP_VERSION: $(grep -o "const APP_VERSION = '[^']*'" native/android/app/src/main/assets/public/app.js)"
          echo "SHA-256: $(sha256sum native/android/app/src/main/assets/public/app.js | cut -d' ' -f1)"
      - name: APK'yı iş çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: aves-saha-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
