<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800">
  <rect width="980" height="800" fill="#fff"/>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#20235b}.h{font-weight:700}.t{font-size:20px}.s{font-size:17px}.line{stroke:#20235b;stroke-width:2;fill:none}.shade{fill:#f2f3f8}</style>
  <text x="490" y="38" text-anchor="middle" class="h t">TS EN ISO 13857:2019 Çizelge 4 — Açıklıklardan erişmeye karşı güvenlik mesafeleri</text>
  <text x="930" y="64" text-anchor="end" class="s">Ölçüler milimetredir</text>
  <rect x="35" y="80" width="900" height="610" class="line"/>
  <rect x="35" y="80" width="900" height="65" class="shade"/>
  <path d="M35 145H935M35 210H935M35 275H935M35 340H935M35 405H935M35 470H935M35 535H935M35 600H935M35 690H935M235 80V690M395 80V690M575 80V690M755 80V690" class="line"/>
  <text x="135" y="119" text-anchor="middle" class="h s">Erişebilen vücut bölümü</text><text x="315" y="108" text-anchor="middle" class="h s">Açıklık ölçüsü e</text><text x="315" y="130" text-anchor="middle" class="s">(mm)</text><text x="665" y="101" text-anchor="middle" class="h s">Tehlikeli bölgeye asgari güvenlik mesafesi</text><text x="485" y="130" text-anchor="middle" class="h s">Yarık</text><text x="665" y="130" text-anchor="middle" class="h s">Kare</text><text x="845" y="130" text-anchor="middle" class="h s">Dairesel</text>
  <text x="135" y="182" text-anchor="middle" class="s">Parmak ucu</text><text x="315" y="182" text-anchor="middle" class="s">e ≤ 4</text><text x="485" y="182" text-anchor="middle" class="h s">≥ 2</text><text x="665" y="182" text-anchor="middle" class="h s">≥ 2</text><text x="845" y="182" text-anchor="middle" class="h s">≥ 2</text>
  <text x="135" y="247" text-anchor="middle" class="s">Parmak ucu</text><text x="315" y="247" text-anchor="middle" class="s">4 &lt; e ≤ 6</text><text x="485" y="247" text-anchor="middle" class="h s">≥ 10</text><text x="665" y="247" text-anchor="middle" class="h s">≥ 5</text><text x="845" y="247" text-anchor="middle" class="h s">≥ 5</text>
  <text x="135" y="312" text-anchor="middle" class="s">Boğuma kadar parmak</text><text x="315" y="312" text-anchor="middle" class="s">6 &lt; e ≤ 8</text><text x="485" y="312" text-anchor="middle" class="h s">≥ 20</text><text x="665" y="312" text-anchor="middle" class="h s">≥ 15</text><text x="845" y="312" text-anchor="middle" class="h s">≥ 5</text>
  <text x="135" y="377" text-anchor="middle" class="s">Boğuma kadar parmak</text><text x="315" y="377" text-anchor="middle" class="s">8 &lt; e ≤ 10</text><text x="485" y="377" text-anchor="middle" class="h s">≥ 80</text><text x="665" y="377" text-anchor="middle" class="h s">≥ 25</text><text x="845" y="377" text-anchor="middle" class="h s">≥ 20</text>
  <text x="135" y="442" text-anchor="middle" class="s">El</text><text x="315" y="442" text-anchor="middle" class="s">10 &lt; e ≤ 12</text><text x="485" y="442" text-anchor="middle" class="h s">≥ 100</text><text x="665" y="442" text-anchor="middle" class="h s">≥ 80</text><text x="845" y="442" text-anchor="middle" class="h s">≥ 80</text>
  <text x="135" y="507" text-anchor="middle" class="s">El</text><text x="315" y="507" text-anchor="middle" class="s">12 &lt; e ≤ 20</text><text x="485" y="507" text-anchor="middle" class="h s">≥ 120</text><text x="665" y="507" text-anchor="middle" class="h s">≥ 120</text><text x="845" y="507" text-anchor="middle" class="h s">≥ 120</text>
  <text x="135" y="572" text-anchor="middle" class="s">El</text><text x="315" y="572" text-anchor="middle" class="s">20 &lt; e ≤ 30</text><text x="485" y="572" text-anchor="middle" class="h s">≥ 850*</text><text x="665" y="572" text-anchor="middle" class="h s">≥ 120</text><text x="845" y="572" text-anchor="middle" class="h s">≥ 120</text>
  <text x="135" y="637" text-anchor="middle" class="s">Omuz birleşimine kadar kol</text><text x="315" y="637" text-anchor="middle" class="s">30 &lt; e ≤ 40</text><text x="485" y="637" text-anchor="middle" class="h s">≥ 850</text><text x="665" y="637" text-anchor="middle" class="h s">≥ 200</text><text x="845" y="637" text-anchor="middle" class="h s">≥ 120</text>
  <text x="135" y="672" text-anchor="middle" class="s">Omuz birleşimine kadar kol</text><text x="315" y="672" text-anchor="middle" class="s">40 &lt; e ≤ 120</text><text x="485" y="672" text-anchor="middle" class="h s">≥ 850</text><text x="665" y="672" text-anchor="middle" class="h s">≥ 850</text><text x="845" y="672" text-anchor="middle" class="h s">≥ 850</text>
  <text x="35" y="728" class="s">e: açıklığın en büyük ölçüsü. Değer, açıklık ile erişilebilir hareketli tehlikeli parça arasındaki en kısa mesafedir.</text>
  <text x="35" y="758" class="s">* Yarık açıklığının uzunluğu ≤ 65 mm ise başparmak durdurucu olur; güvenlik mesafesi ≥ 200 mm’ye indirilebilir.</text>
  <text x="35" y="786" class="s">120 mm’den büyük açıklıklar bu tablonun dışında ayrıca değerlendirilmelidir.</text>
</svg>
