<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AVES Saha Güncelleme</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#20234f;background:#f5f6fa}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(520px,100%);background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 38px rgba(20,23,67,.15)}
    img{height:34px}h1{font-size:20px;margin:18px 0 8px}p{line-height:1.5;color:#545873}
    .status{margin-top:16px;padding:12px;border-radius:10px;background:#eef3ff;font-weight:700}
    .error{background:#fff0f0;color:#9b2525}.ok{background:#e8f7ef;color:#12643d}
    button{border:0;border-radius:9px;background:#ea0048;color:#fff;font-weight:800;padding:11px 14px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="AVES">
    <h1>AVES Saha güvenli güncelleme</h1>
    <p>Yeni sürüm sunucuda doğrulandıktan sonra yalnız eski uygulama önbelleği kaldırılır. Çevrimdışı denetim cevapları ve cihazdaki kayıtlar korunur.</p>
    <div id="updateStatus" class="status">Yeni sürüm doğrulanıyor…</div>
    <p><button id="retryUpdate" type="button" hidden>Yeniden dene</button></p>
  </main>
  <script src="update.js"></script>
</body>
</html>
